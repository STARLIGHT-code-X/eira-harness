name: Test Eira

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --wheel --sdist --outdir "$RUNNER_TEMP/eira-dist"
          test -n "$(find "$RUNNER_TEMP/eira-dist" -name 'eira_harness-*.whl' -print -quit)"
          test -n "$(find "$RUNNER_TEMP/eira-dist" -name 'eira_harness-*.tar.gz' -print -quit)"
      - name: Install wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/eira-venv"
          "$RUNNER_TEMP/eira-venv/bin/python" -m pip install --no-deps "$(find "$RUNNER_TEMP/eira-dist" -name 'eira_harness-*.whl' -print -quit)"
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/eira-venv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
      - name: Verify both command names
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/eira-venv/bin/Eira" --version
          "$RUNNER_TEMP/eira-venv/bin/eira" --version
      - name: Run installed demo
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/eira-venv/bin/eira" demo --workspace "$RUNNER_TEMP/eira-ci-demo" --json

  docker-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pull the shell image
        run: docker pull python:3.11-slim
      - name: Exercise Docker shell mode against a real daemon
        env:
          EIRA_DOCKER_IMAGE: python:3.11-slim
        run: python -m unittest tests.test_docker_integration -v
